[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-analytics"
version = "1.0.0"
description = "Análise de dados e modelagem dimensional de uma carteira de seguros digital (Python + SQL)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bruno Silva" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbclient", "nbformat", "ipykernel"]

[project.scripts]
insurance-pipeline = "insurance_analytics.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insurance_analytics = ["sql/*.sql", "sql/kpis/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
